<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotina de Treino v4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F1F3EE; color: #17241F; }
h1, .card-title, .home-name, .stat-n, .ex-num, .month-goal-pct, .medal-label, .home-option-title { font-family: 'Space Grotesk', 'Inter', sans-serif; }
.app { max-width: 520px; margin: 0 auto; padding: 1.25rem 1rem calc(90px + env(safe-area-inset-bottom)); }
h1 { font-size: 19px; font-weight: 700; margin-bottom: 3px; }
.subtitle { font-size: 13px; color: #666; margin-bottom: 2px; }

.nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }

.day-btn:hover { background: #f0f0f0; }
.day-btn.active { background: #2F5443; border-color: #2F5443; color: #fff; }

.card { background: #fff; border-radius: 14px; border: 1px solid #E2E5DE; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3px; }
.card-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 700; }
.bp { background: #DCE8DE; color: #2F5443; }
.bl { background: #E1F5EE; color: #2F5443; }
.bg { background: #F0DAE0; color: #A8425B; }
.bs { background: #E6F1FB; color: #185FA5; }
.bfull { background: #F3E6C8; color: #8A6A22; }
.time-tag { font-size: 11px; padding: 3px 10px; border-radius: 999px; font-weight: 700; background: #E1F5EE; color: #2F5443; white-space: nowrap; }
.time-tag.long { background: #E6F1FB; color: #185FA5; }
.card-sub { font-size: 12px; color: #888; margin-bottom: .9rem; }
.alert { margin-bottom: .9rem; padding: 9px 12px; border-radius: 8px; border-left: 3px solid #C99A3E; background: #FEF6E7; }
.alert-title { font-size: 11px; font-weight: 700; color: #8A5500; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
.alert p { font-size: 12px; color: #8A5500; }
.section-sep { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .06em; margin: 1rem 0 6px; padding-bottom: 4px; border-bottom: 1px solid #E2E5DE; }
.ex-list { display: flex; flex-direction: column; gap: 8px; }
.ex-wrap { border-radius: 9px; background: #f8f8f5; border: 1px solid #E2E5DE; overflow: hidden; }
.ex-wrap.glute { border-left: 3px solid #A8425B; }
.ex-wrap.core { border-left: 3px solid #3A6B1A; }
.ex-wrap.new-item { border-left: 3px solid #3A6B1A; box-shadow: 0 0 0 1px #cfe3b8 inset; }
.ex { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 9px 11px; cursor: pointer; }
.ex-name { font-size: 13px; font-weight: 600; }
.ex-note { font-size: 11px; color: #777; margin-top: 2px; }
.ex-chip { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 999px; margin-top: 3px; margin-right: 4px; font-weight: 600; background: #DCE8DE; color: #2F5443; }
.ex-chip.glute-chip { background: #F0DAE0; color: #A8425B; }
.ex-chip.core-chip { background: #F0F7E6; color: #3A6B1A; }
.ex-chip.new-chip { background: #F0F7E6; color: #3A6B1A; }
.ex-sets { text-align: right; white-space: nowrap; }
.ex-num { font-size: 13px; font-weight: 700; color: #534AB7; }
.ex-lbl { font-size: 10px; color: #aaa; }
.ex-toggle { font-size: 10px; color: #534AB7; font-weight: 700; margin-top: 4px; }
.ex-detail { display: none; padding: 0 11px 12px; border-top: 1px dashed #e2e2da; }
.ex-detail.open { display: block; }
.ex-detail-title { font-size: 10px; font-weight: 700; color: #534AB7; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 6px; }
.ex-steps { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.ex-steps li { font-size: 12px; color: #444; padding-left: 16px; position: relative; }
.ex-steps li::before { content: attr(data-i); position: absolute; left: 0; color: #534AB7; font-weight: 700; font-size: 11px; }
.yt-link { display: inline-block; margin-top: 9px; font-size: 12px; font-weight: 700; color: #cc0000; text-decoration: none; padding: 6px 10px; border-radius: 7px; background: #fdeaea; }
.tips { margin-top: 1rem; padding: 10px 12px; border-radius: 9px; background: #f8f8f5; border-left: 3px solid #534AB7; }
.tips-title { font-size: 11px; font-weight: 700; color: #534AB7; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
.tips ul { list-style: none; display: flex; flex-direction: column; gap: 3px; }
.tips li { font-size: 12px; color: #555; padding-left: 13px; position: relative; }
.tips li::before { content: '→'; position: absolute; left: 0; color: #534AB7; }
.rest-box { padding: 1.5rem; text-align: center; }
.rest-txt { font-size: 15px; color: #666; }
.rest-sub { font-size: 12px; color: #999; margin-top: 5px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: .5rem; }
.stat { padding: 9px 4px; background: #fff; border-radius: 10px; border: 1px solid #E2E5DE; text-align: center; }
.stat-n { font-size: 16px; font-weight: 700; }
.stat-l { font-size: 9px; color: #888; margin-top: 2px; }
.version-tag { display: inline-block; font-size: 10px; background: #F3E6C8; color: #8A6A22; padding: 2px 8px; border-radius: 999px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
.weekly-overview { background: #fff; border-radius: 14px; border: 1px solid #E2E5DE; padding: 1rem 1.2rem; margin-bottom: 1rem; }
.weekly-title { font-size: 13px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
.week-row { display: flex; justify-content: space-between; gap: 4px; }
.week-day { flex: 1; text-align: center; }
.week-day-name { font-size: 10px; color: #aaa; margin-bottom: 4px; }
.week-day-dot { width: 32px; height: 32px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.week-day-label { font-size: 9px; color: #888; margin-top: 3px; line-height: 1.2; }

/* ===== Perfil ===== */
.livre-btn { background: #F0DAE0 !important; color: #A8425B !important; border-color: #A8425B !important; opacity: 1 !important; }

.sub-box { padding: 12px; border-radius: 10px; background: #f8f8f5; border: 1px solid #E2E5DE; margin-bottom: 12px; }
.sub-box-title { font-size: 12px; font-weight: 700; color: #555; margin-bottom: 8px; }
.hint { font-size: 11px; color: #999; margin-top: 6px; }
.input-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.altura-row { display: flex; gap: 6px; }
.input-sm { flex: 1; min-width: 90px; padding: 8px 10px; border-radius: 7px; border: 1px solid #ccc; font-size: 13px; background: #fff; }
.btn-save { padding: 8px 14px; border-radius: 7px; border: none; background: #2F5443; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-save:hover { background: #203B2F; }
.history-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.history-item { padding: 9px 11px; border-radius: 8px; background: #fff; border: 1px solid #ececec; }
.history-item-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; }
.imc-inline { font-size: 11px; color: #888; margin-top: 3px; }
.arrow-g { color: #2e8b3a; font-weight: 700; font-size: 11px; }
.arrow-r { color: #c0392b; font-weight: 700; font-size: 11px; }
.arrow-y { color: #b8860b; font-weight: 700; font-size: 11px; }
.arrow-base { color: #bbb; font-size: 10px; }
.measure-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.input-measure { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid #ccc; font-size: 12px; background: #fff; min-width: 0; }
.measure-line { font-size: 11px; color: #666; margin-top: 3px; display: flex; justify-content: space-between; }
.progress-row { margin: 12px 0; }
.progress-bar { height: 12px; border-radius: 6px; background: #eee; overflow: hidden; }
.progress-fill { height: 100%; background: #2F5443; border-radius: 6px; transition: width .2s; }
.progress-label { font-size: 10px; color: #888; margin-top: 5px; }
.checkin-btn { width: 100%; padding: 14px; border-radius: 9px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 6px; }
.checkin-btn.locked { background: #ececec; color: #999; cursor: default; }
.timer-start-btn { display: block; width: 100%; padding: 12px; border-radius: 10px; border: 1px dashed #2F5443; background: #DCE8DE; color: #2F5443; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 12px; }
.timer-live { text-align: center; font-size: 18px; font-weight: 700; color: #A8425B; background: #F0DAE0; border-radius: 10px; padding: 10px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
.timer-done { text-align: center; font-size: 13px; font-weight: 700; color: #2F5443; background: #DCE8DE; border-radius: 10px; padding: 9px; margin-bottom: 12px; }
.ex-swap-row { padding: 0 11px 10px; }
.ex-swap-note { font-size: 10px; color: #A8425B; margin-bottom: 5px; }
.ex-swap-select { width: 100%; padding: 6px 9px; border-radius: 6px; border: 1px dashed #C7CDC3; background: #fff; font-size: 11px; color: #55645C; }
.checkin-btn.enabled { background: #F0F7E6; color: #3A6B1A; border: 1px solid #3A6B1A; }
.checked-item { background: #DCE8DE; }
.week-challenge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 11px; }
.week-label { width: 42px; color: #666; font-weight: 600; }
.week-bar-bg { flex: 1; height: 12px; border-radius: 6px; background: #eee; overflow: hidden; }
.week-bar-fill { height: 100%; background: #C99A3E; border-radius: 6px; }
.week-bar-fill.hit { background: #2F5443; }
.week-vals { width: 110px; text-align: right; color: #777; }
.month-goal-box { margin-top: 10px; padding: 12px; border-radius: 9px; background: #E6F1FB; border: 1px solid #b8d4ef; text-align: center; }
.month-goal-title { font-size: 12px; font-weight: 700; color: #185FA5; }
.month-goal-pct { font-size: 22px; font-weight: 700; color: #185FA5; margin: 3px 0; }
.month-goal-sub { font-size: 11px; color: #185FA5; }
.history-row { padding: 10px 11px; border-radius: 8px; background: #f8f8f5; margin-bottom: 6px; }
.history-main { font-size: 12px; font-weight: 600; color: #444; }
.history-pct { font-size: 12px; font-weight: 700; margin-top: 3px; }
.history-pct.pass { color: #2F5443; }
.history-pct.fail { color: #c0392b; }
.medal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.medal { text-align: center; padding: 10px 2px; border-radius: 10px; background: #eee; opacity: .45; }
.medal.unlocked { background: #F3E6C8; opacity: 1; }
.medal-icon { font-size: 20px; }
.medal-label { font-size: 10px; color: #888; margin-top: 3px; font-weight: 700; }

/* ===== Home ===== */
.back-btn { display: inline-block; margin-bottom: 14px; padding: 7px 14px; border-radius: 999px; border: 1px solid #E2E5DE; background: #fff; color: #55645C; font-size: 12px; font-weight: 600; cursor: pointer; }
.back-btn:hover { background: #F1F3EE; }
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #fff; border-top: 1px solid #E2E5DE; padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 50; max-width: 520px; margin: 0 auto; }
.bottom-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; padding: 6px 2px; cursor: pointer; color: #8B978F; }
.bottom-nav-icon { font-size: 20px; opacity: .6; }
.bottom-nav-label { font-size: 10px; font-weight: 600; }
.bottom-nav-item.active { color: #2F5443; }
.bottom-nav-item.active .bottom-nav-icon { opacity: 1; }
.home-wrap { padding: 0.5rem 0.2rem 1rem; }
.home-greet { font-size: 11px; letter-spacing: 2px; color: #8B978F; font-weight: 700; }
.home-name { font-size: 30px; font-weight: 700; margin-top: 4px; color: #17241F; line-height: 1.15; }
.home-name em { font-style: italic; color: #2F5443; }
.home-date { font-size: 11px; color: #8B978F; margin: 6px 0 14px; }
.home-stats-row { display: flex; gap: 8px; margin-bottom: 10px; }
.home-stat { flex: 1; background: #fff; border: 1px solid #E2E5DE; border-radius: 14px; padding: 12px 4px; text-align: center; }
.home-stat-icon { font-size: 18px; }
.home-stat-val { font-size: 11px; font-weight: 700; color: #17241F; margin-top: 4px; }
.home-furo-note { font-size: 10px; color: #8B978F; margin-bottom: 16px; }
.home-cta { display: block; width: 100%; text-align: left; border: none; border-radius: 20px; padding: 20px; margin-bottom: 16px; background: linear-gradient(135deg, #203B2F 0%, #2F5443 100%); color: #fff; cursor: pointer; }
.home-cta-label { font-size: 10px; letter-spacing: 1.5px; font-weight: 700; color: #C99A3E; }
.home-cta-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; margin-top: 6px; }
.home-cta-sub { font-size: 12px; color: #DCE8DE; margin-top: 4px; }
.home-cta-btn { display: inline-block; margin-top: 14px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 999px; }
.home-quote-box { position: relative; background: #fff; border: 1px solid #E2E5DE; border-left: 3px solid #C99A3E; border-radius: 14px; padding: 16px 18px 14px; margin-bottom: 18px; }
.home-quote-mark { font-size: 20px; color: #C99A3E; line-height: 1; }
.home-quote-text { font-size: 13px; font-style: italic; color: #17241F; line-height: 1.5; margin-top: 2px; }
.home-quote-label { font-size: 10px; color: #8B978F; margin-top: 8px; text-align: right; }
.home-option { width: 100%; display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; border: 1px solid #E2E5DE; margin-bottom: 10px; cursor: pointer; text-align: left; background: #fff; }
.home-option-icon { font-size: 24px; }
.home-option-text { flex: 1; display: flex; flex-direction: column; }
.home-option-title { color: #17241F; font-size: 14px; font-weight: 700; letter-spacing: .5px; }
.home-option-sub { color: #8B978F; font-size: 10px; margin-top: 2px; }
.home-option-arrow { font-size: 18px; color: #8B978F; }
.home-option-treino { border-left: 3px solid #2F5443; }
.home-option-historico { border-left: 3px solid #C99A3E; }
.home-option-evolucao { border-left: 3px solid #A8425B; }
.home-stat-sub { font-size: 8px; color: #8B978F; margin-top: 1px; }
.quick-row { display: flex; gap: 8px; margin-bottom: 18px; }
.quick-pill { flex: 1; padding: 12px 6px; border-radius: 12px; border: 1px dashed #C7CDC3; background: #fff; color: #17241F; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; }
.quick-pill:hover { background: #F1F3EE; }
.achv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.achv { background: #F1F3EE; border-radius: 14px; padding: 14px 10px; text-align: center; opacity: .5; }
.achv.unlocked { background: #DCE8DE; opacity: 1; }
.achv-icon { font-size: 22px; }
.achv-title { font-size: 12px; font-weight: 700; color: #17241F; margin-top: 6px; }
.achv-sub { font-size: 10px; color: #55645C; margin-top: 2px; }

/* ===== Backup ===== */
.backup-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-save-green { background: #2F5443; }
.btn-save-green:hover { background: #1c3a2d; }
.btn-save-red { background: #c0392b; margin-top: 8px; }
.btn-save-red:hover { background: #9e2e21; }
.backup-textarea { width: 100%; min-height: 90px; padding: 9px; border-radius: 8px; border: 1px solid #ccc; font-size: 11px; font-family: 'SF Mono', Consolas, monospace; background: #fff; resize: vertical; }

/* ===== Carga por exercício ===== */
.ex-weight-row { padding: 0 11px 10px; }
.ex-weight-hint { font-size: 10px; color: #888; margin-bottom: 5px; }
.input-weight { width: 100px; padding: 6px 9px; border-radius: 6px; border: 1px solid #ccc; font-size: 12px; background: #fff; }
.ex-weight-input-row { display: flex; gap: 6px; align-items: center; }
.btn-weight-save { padding: 6px 12px; border-radius: 6px; border: none; background: #2F5443; color: #fff; font-size: 11px; font-weight: 700; cursor: pointer; }
.btn-weight-save:hover { background: #203B2F; }
.ex-checkbox { margin-right: 7px; cursor: pointer; }
.history-toggle { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; color: #2F5443; cursor: pointer; background: none; border: none; padding: 0; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const WEEKLY_OVERVIEW_HTML = `
  <div class="weekly-overview">
    <div class="weekly-title">Visão da semana</div>
    <div class="week-row">
      <div class="week-day"><div class="week-day-name">Seg</div><div class="week-day-dot" style="background:#f0f0ec">😴</div><div class="week-day-label">Descanso</div></div>
      <div class="week-day"><div class="week-day-name">Ter</div><div class="week-day-dot" style="background:#F0DAE0">🦵</div><div class="week-day-label">Pernas + Core</div></div>
      <div class="week-day"><div class="week-day-name">Qua</div><div class="week-day-dot" style="background:#DCE8DE">💪</div><div class="week-day-label">Peito + Tri + Core</div></div>
      <div class="week-day"><div class="week-day-name">Qui</div><div class="week-day-dot" style="background:#f0f0ec">😴</div><div class="week-day-label">Descanso</div></div>
      <div class="week-day"><div class="week-day-name">Sex</div><div class="week-day-dot" style="background:#E6F1FB">🏋️</div><div class="week-day-label">Ombros + Tri ⚽</div></div>

const STATS_HTML = `

    <div class="stat"><div class="stat-n">2x</div><div class="stat-l">Bíceps/semana</div></div>

    <div class="stat"><div class="stat-n">3x</div><div class="stat-l">Glúteo/semana</div></div>

const days = [
  { label: 'Seg', rest: true },
  { label: 'Ter', title: 'Pernas + Core', badge: 'bg', bl: 'Legs', time: '~50min',
    sections: [
      { title: '🦵 Pernas', exs: [
        { n: 'Abdução de quadril na máquina', o: 'Glúteo médio — prioridade, agora em 1º (fresco)', s: '4x', r: '15', type: 'glute',

function ytLink(name) {
  const q = encodeURIComponent(name + ' execução correta');
  return `<a class="yt-link" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">▶ Ver execução no YouTube</a>`;
}

function renderEx(e, dayLabel, isToday, daylog) {
  const id = 'ex' + (uid++);
  const iso = todayISO();
  const rec = daylog[iso] || { exercises: [] };
  const swappedTo = isToday && rec.swaps && rec.swaps[e.n];
  const effectiveName = swappedTo || e.n;
  const hasDetail = !!e.howto && !swappedTo;
  const done = isToday && rec.exercises && rec.exercises.includes(effectiveName);
  const showWeight = isToday && e.type !== 'core';
  let weightBlock = '';
  if (showWeight) {
    const currentW = (rec.weights && rec.weights[effectiveName]) || '';
    const lastW = lastWeightFor(effectiveName, daylog, iso);
    const pr = prFor(effectiveName, daylog);
    const sugg = suggestedWeight(lastW);
    const hint = (lastW || pr) ? `<div class="ex-weight-hint">${lastW?`Última: ${lastW}kg`:''}${sugg?` · Tente: ${sugg}kg`:''}${pr?` · 🏆 PR: ${pr}kg`:''}</div>` : '';
    weightBlock = `<div class="ex-weight-row">
      ${hint}
      <div class="ex-weight-input-row">
        <input type="number" step="0.5" value="${currentW}" placeholder="kg hoje" class="input-weight" id="${id}_w" onclick="event.stopPropagation()"/>
        <button class="btn-weight-save" onclick='event.stopPropagation(); saveExerciseWeightFromInput(${JSON.stringify(id+"_w")}, ${JSON.stringify(iso)}, ${JSON.stringify(dayLabel)}, ${JSON.stringify(effectiveName)})'>✓ Salvar</button>
      </div>
    </div>`;
  }
  const checkboxHTML = isToday ? `<span class="ex-checkbox" onclick='event.stopPropagation(); toggleExerciseCheck(${JSON.stringify(iso)},${JSON.stringify(dayLabel)},${JSON.stringify(effectiveName)})'>${done?'✅':'⬜'}</span>` : '';
  let swapBlock = '';
  if (isToday) {
    const alts = alternativesFor(e.type, e.n);
    swapBlock = `<div class="ex-swap-row">
      ${swappedTo?`<div class="ex-swap-note">🔄 no lugar de: ${e.n}</div>`:''}
      <select class="ex-swap-select" onclick="event.stopPropagation()" onchange='event.stopPropagation(); swapExercise(${JSON.stringify(iso)}, ${JSON.stringify(e.n)}, this.value)'>
        <option value="" ${!swappedTo?'selected':''}>🔄 Trocar exercício...</option>
        ${alts.map(a => `<option value="${a.name}" ${swappedTo===a.name?'selected':''}>${a.name}</option>`).join('')}
      </select>
    </div>`;
  }
  return `<div class="ex-wrap${exClass[e.type]||''}${e.isNew?' new-item':''}${done?' checked-item':''}">
    <div class="ex" ${hasDetail?`onclick="toggleEx('${id}')"`:''}>
      <div>
        <div class="ex-name">${checkboxHTML}${effectiveName}</div>
        <div class="ex-note">${e.o}</div>
        <span class="ex-chip${chipClass[e.type]||''}">${chipLabel[e.type]||'máquina'}</span>
        ${e.isNew?'<span class="ex-chip new-chip">novo v4</span>':''}
        ${hasDetail?`<div class="ex-toggle">▾ como executar</div>`:''}
      </div>
      <div class="ex-sets"><div class="ex-num">${e.s} ${e.r}</div><div class="ex-lbl">séries · reps</div></div>
    </div>
    ${weightBlock}
    ${swapBlock}
    ${hasDetail?`<div class="ex-detail" id="${id}">
      <div class="ex-detail-title">Como executar</div><ol class="ex-steps">${e.howto.map((s,i)=>`<li data-i="${i+1}.">${s}</li>`).join('')}</ol>
      ${ytLink(e.n)}
    </div>`:''}
  </div>`;
}

function saveExerciseWeightFromInput(inputId, iso, label, name) {
  const el = document.getElementById(inputId);
  if (!el) return;
  const v = parseFloat(el.value);
  saveExerciseWeight(iso, label, name, v);
  renderApp();
}

function toggleEx(id) {
  document.getElementById(id).classList.toggle('open');
}

function renderTreinoContent() {
  document.getElementById('nav').innerHTML = days.map((d,i) =>
    `<button class="day-btn${d.rest?' rest':''}${i===active?' active':''}" onclick="${d.rest?'':('setDay('+i+')')}">${d.label}</button>`
  ).join('') + `<button class="day-btn livre-btn${active==='livre'?' active':''}" onclick="setDay('livre')">🎲 Livre</button>`;

  if (active === 'livre') { renderTreinoLivre(); return; }

  const d = days[active];
  const daylog = loadJSON(SK.daylog, {});
  const iso = todayISO();
  const isToday = d.label === weekdayLabelFromISO(iso);

  if (d.rest) {
    const rec = daylog[iso] || { extraActivity: false };
    const extraBlock = isToday ? `
      <button class="checkin-btn enabled" style="margin-top:16px" onclick='toggleExtraActivity(${JSON.stringify(iso)},${JSON.stringify(d.label)})'>
        ${rec.extraActivity ? '✓ ATIVIDADE EXTRA REGISTRADA (toque pra desfazer)' : '✅ FIZ ATIVIDADE EXTRA HOJE (+1.500 pts)'}
      </button>
      <p class="hint" style="text-align:center">Não conta pro streak nem usa o furo semanal — é só pontos bônus.</p>` : '';
    document.getElementById('content').innerHTML = `<div class="card"><div class="rest-box"><div style="font-size:28px;margin-bottom:8px">🌙</div><div class="rest-txt">Dia de descanso</div><div class="rest-sub">Caminhada leve, alongamento ou mobilidade articular</div></div>${extraBlock}</div>`;
    return;
  }

  uid = 0;
  let exHTML = '';
  if (d.sections) {
    d.sections.forEach(sec => {
      exHTML += `<div class="section-sep">${sec.title}</div><div class="ex-list">${sec.exs.map(e => renderEx(e, d.label, isToday, daylog)).join('')}</div>`;
    });
  }

  let timerBlock = '';
  const recForTimer = daylog[iso] || {};
  if (isToday) {
    if (!recForTimer.startedAt) {
      timerBlock = `<button class="timer-start-btn" onclick='startWorkoutTimer(${JSON.stringify(iso)},${JSON.stringify(d.label)})'>▶ Iniciar treino</button>`;
    } else if (recForTimer.startedAt && !recForTimer.finishedAt) {
      timerBlock = `<div class="timer-live">⏱ <span id="live-timer">00:00</span></div>`;
    } else if (recForTimer.finishedAt) {
      timerBlock = `<div class="timer-done">⏱ Concluído em ${fmtDuration(recForTimer.finishedAt - recForTimer.startedAt)}</div>`;
    }
  }

  let checkinBlock = '';
  if (isToday) {
    const allEx = flattenExercises(d);
    const rec = daylog[iso] || { exercises: [], dayCheckedIn: false };
    const checkedCount = rec.exercises.length;
    const total = allEx.length;
    const required = Math.ceil(total * 0.5);
    const pct = total ? Math.round(checkedCount/total*100) : 0;
    const canCheckIn = checkedCount >= required;
    checkinBlock = `
      <div class="progress-row">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label">${checkedCount} / ${total} exercícios (${pct}%) — mínimo ${required} pra liberar o check-in geral</div>
      </div>
      <button class="checkin-btn ${rec.dayCheckedIn ? 'enabled' : (canCheckIn ? 'enabled' : 'locked')}" onclick='${canCheckIn ? `toggleDayCheckin(${JSON.stringify(iso)},${JSON.stringify(d.label)})` : ''}'>
        ${rec.dayCheckedIn ? '✓ TREINO CONCLUÍDO HOJE (toque pra desfazer)' : (canCheckIn ? '✓ CONCLUIR TREINO DE HOJE (+3.000 pts)' : `🔒 CONCLUIR TREINO DE HOJE — faltam ${required-checkedCount} exercício(s)`)}
      </button>`;
  }

  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">${d.title} <span class="badge ${badgeClass[d.badge]}">${d.bl}</span></div>
        <span class="time-tag${d.long?' long':''}">${d.time}</span>
      </div>
      ${!isToday?`<div class="alert"><div class="alert-title">ℹ Info</div><p>Isso aqui é só consulta — carga e check-in só ficam ativos no dia de hoje.</p></div>`:''}
      ${d.alert?`<div class="alert"><div class="alert-title">ℹ Info</div><p>${d.alert}</p></div>`:''}
      ${timerBlock}
      ${exHTML}
      ${checkinBlock}
      <div class="tips"><div class="tips-title">💡 Dicas do dia</div><ul>${d.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    </div>`;

  if (isToday && recForTimer.startedAt && !recForTimer.finishedAt) {
    const startedAt = recForTimer.startedAt;
    const tick = () => {
      const el = document.getElementById('live-timer');
      if (el) el.textContent = fmtDuration(Date.now() - startedAt);
    };
    tick();
    timerIntervalId = setInterval(tick, 1000);
  }
}
function setDay(i) { active = i; renderTreinoContent(); }

function loadJSON(key, fb) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch(e) { return fb; } }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function fmtDateBR(iso) { const [y,m,d] = iso.split('-'); return d + '/' + m + '/' + y.slice(2); }
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

const WEEKDAY_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function weekdayLabelFromISO(iso) { const d = new Date(iso + 'T00:00:00'); return WEEKDAY_LABELS[d.getDay()]; }
function dayDefByLabel(label) { return days.find(d => d.label === label); }
function flattenExercises(dayDef) {
  if (!dayDef || dayDef.rest) return [];
  let list = [];
  dayDef.sections.forEach(sec => sec.exs.forEach(e => list.push({name: e.n, type: e.type})));
  return list;
}

/* ===== Streak com furo semanal ===== */
const TRAINING_LABELS = ['Ter','Qua','Sex','Sáb','Dom'];
function isTrainingLabel(label) { return TRAINING_LABELS.includes(label); }
function mondayOfWeek(dateObj) {
  const d = new Date(dateObj);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function weekKey(dateObj) {
  const mon = mondayOfWeek(dateObj);
  return mon.getFullYear() + '-' + String(mon.getMonth()+1).padStart(2,'0') + '-' + String(mon.getDate()).padStart(2,'0');
}
function computeStreak(daylog) {
  const todayStr = todayISO();
  const todayDate = new Date(todayStr + 'T00:00:00');
  const keys = Object.keys(daylog);
  let minDate = new Date(todayDate);
  keys.forEach(iso => { const d = new Date(iso + 'T00:00:00'); if (d < minDate) minDate = d; });
  let streak = 0;
  let furoUsedThisWeek = {};
  let cursor = new Date(minDate);
  while (cursor < todayDate) {
    const iso = cursor.getFullYear() + '-' + String(cursor.getMonth()+1).padStart(2,'0') + '-' + String(cursor.getDate()).padStart(2,'0');
    const label = weekdayLabelFromISO(iso);
    if (isTrainingLabel(label)) {
      const wk = weekKey(cursor);
      if (furoUsedThisWeek[wk] === undefined) furoUsedThisWeek[wk] = false;
      const rec = daylog[iso];
      if (rec && rec.dayCheckedIn) {
        streak += 1;
      } else if (!furoUsedThisWeek[wk]) {
        furoUsedThisWeek[wk] = true;
      } else {
        streak = 0;
      }
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  const todayLabel = weekdayLabelFromISO(todayStr);
  const wkToday = weekKey(todayDate);
  let furoAvailable = !furoUsedThisWeek[wkToday];
  if (isTrainingLabel(todayLabel)) {
    const recToday = daylog[todayStr];
    if (recToday && recToday.dayCheckedIn) streak += 1;
  }
  return { streak, furoAvailable };
}

function phraseOfDay() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  const dayOfYear = Math.floor(diff / 86400000);
  return PHRASES[dayOfYear % PHRASES.length];
}

function computeIMC(peso, alturaCm) { const m = alturaCm/100; return peso/(m*m); }
function classifyIMC(imc) { if (imc < 18.5) return 'Abaixo do peso'; if (imc < 25) return 'Normal'; if (imc < 30) return 'Sobrepeso'; return 'Obesidade'; }

const MEASURE_DIRECTIONS = { peso:'down', braco_relaxado:'up', braco_contraido:'up', peito:'up', cintura:'down', abdomen:'down', quadril:'up', perna:'up', panturrilha:'up' };
const MEASURE_LABELS = { braco_relaxado:'Braço relaxado', braco_contraido:'Braço contraído', peito:'Peito', cintura:'Cintura', abdomen:'Abdômen', quadril:'Quadril', perna:'Perna', panturrilha:'Panturrilha' };
const MEASURE_FIELDS = Object.keys(MEASURE_LABELS);

function arrowHTML(field, newVal, oldVal) {
  if (oldVal === undefined || oldVal === null) return '<span class="arrow-base">(base)</span>';
  if (newVal === oldVal) return '<span class="arrow-y">= 🟡</span>';
  const wentUp = newVal > oldVal;
  const desiredUp = MEASURE_DIRECTIONS[field] === 'up';
  const good = wentUp === desiredUp;
  const sym = wentUp ? '↑' : '↓';
  return good ? `<span class="arrow-g">${sym} 🟢</span>` : `<span class="arrow-r">${sym} 🔴</span>`;
}
function prevMeasureValue(sortedAsc, idx, field) {
  for (let i = idx-1; i >= 0; i--) {
    if (sortedAsc[i][field] !== undefined && sortedAsc[i][field] !== null && sortedAsc[i][field] !== '') return sortedAsc[i][field];
  }
  return null;
}

function saveAltura() {
  const v = parseFloat(document.getElementById('alturaInput').value);
  if (!v || v <= 0) return;
  saveJSON(SK.altura, v);
  renderApp();
}
function savePesoEntry() {
  const date = document.getElementById('pesoData').value;
  const v = parseFloat(document.getElementById('pesoValor').value);
  if (!date || !v) return;
  let arr = loadJSON(SK.pesos, []);
  const idx = arr.findIndex(r => r.date === date);
  if (idx >= 0) arr[idx].peso = v; else arr.push({date, peso: v});
  saveJSON(SK.pesos, arr);
  renderApp();
}
function salvarMedidas() {
  const date = document.getElementById('medData').value;
  if (!date) return;
  const newFields = {};
  MEASURE_FIELDS.forEach(f => {
    const el = document.getElementById('med_' + f);
    if (el && el.value !== '') newFields[f] = parseFloat(el.value);
  });
  if (Object.keys(newFields).length === 0) return;
  let arr = loadJSON(SK.medidas, []);
  const idx = arr.findIndex(r => r.date === date);
  if (idx >= 0) arr[idx] = {...arr[idx], ...newFields}; else arr.push({date, ...newFields});
  saveJSON(SK.medidas, arr);
  renderApp();
}
function toggleExerciseCheck(iso, label, name) {
  let daylog = loadJSON(SK.daylog, {});
  if (!daylog[iso]) daylog[iso] = { weekday: label, exercises: [], dayCheckedIn: false };
  const idx = daylog[iso].exercises.indexOf(name);
  if (idx >= 0) daylog[iso].exercises.splice(idx, 1); else daylog[iso].exercises.push(name);
  saveJSON(SK.daylog, daylog);
  renderApp();
}
function toggleDayCheckin(iso, label) {
  let daylog = loadJSON(SK.daylog, {});
  if (!daylog[iso]) daylog[iso] = { weekday: label, exercises: [], dayCheckedIn: false };
  daylog[iso].dayCheckedIn = !daylog[iso].dayCheckedIn;
  if (daylog[iso].dayCheckedIn) {
    daylog[iso].finishedAt = Date.now();
  } else {
    delete daylog[iso].finishedAt;
  }
  saveJSON(SK.daylog, daylog);
  renderApp();
}

/* ===== Cronômetro de treino ===== */
function fmtDuration(ms) {
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function startWorkoutTimer(iso, label) {
  let daylog = loadJSON(SK.daylog, {});
  if (!daylog[iso]) daylog[iso] = { weekday: label, exercises: [], dayCheckedIn: false };
  daylog[iso].startedAt = Date.now();
  saveJSON(SK.daylog, daylog);
  renderApp();
}

/* ===== Trocar exercício ===== */
function swapExercise(iso, originalName, newName) {
  let daylog = loadJSON(SK.daylog, {});
  if (!daylog[iso]) daylog[iso] = { weekday: weekdayLabelFromISO(iso), exercises: [], dayCheckedIn: false };
  if (!daylog[iso].swaps) daylog[iso].swaps = {};
  if (newName) daylog[iso].swaps[originalName] = newName; else delete daylog[iso].swaps[originalName];
  saveJSON(SK.daylog, daylog);
  renderApp();
}
function alternativesFor(type, excludeName) {
  return allUniqueExercises().filter(e => e.type === type && e.name !== excludeName);
}

function pointsOf(rec) {
  if (!rec) return 0;
  let p = 0;
  if (rec.exercises) p += rec.exercises.length * 1000;
  if (rec.dayCheckedIn) p += 3000;
  if (rec.extraActivity) p += 1500;
  if (rec.livre) p += rec.livre.exercises.length * 1000 + (rec.livre.done ? 2000 : 0);
  return p;
}

/* ===== Carga por exercício (histórico, PR, sugestão) ===== */
function saveExerciseWeight(iso, label, name, weight) {
  if (!weight || isNaN(weight) || weight <= 0) return;
  let daylog = loadJSON(SK.daylog, {});
  if (!daylog[iso]) daylog[iso] = { weekday: label, exercises: [], dayCheckedIn: false };
  if (!daylog[iso].weights) daylog[iso].weights = {};
  daylog[iso].weights[name] = weight;
  saveJSON(SK.daylog, daylog);
}
function weightHistoryFor(name, daylog) {
  return Object.keys(daylog).filter(iso => daylog[iso].weights && daylog[iso].weights[name] !== undefined)
    .sort().map(iso => ({date: iso, weight: daylog[iso].weights[name]}));
}
function lastWeightFor(name, daylog, beforeISO) {
  const hist = weightHistoryFor(name, daylog).filter(h => !beforeISO || h.date < beforeISO);
  return hist.length ? hist[hist.length-1].weight : null;
}
function prFor(name, daylog) {
  const hist = weightHistoryFor(name, daylog);
  if (!hist.length) return null;
  return Math.max(...hist.map(h => h.weight));
}
function suggestedWeight(lastW) {
  if (!lastW) return null;
  return Math.round((lastW + 2.5) * 2) / 2;
}
function toggleExtraActivity(iso, label) {
  let daylog = loadJSON(SK.daylog, {});
  if (!daylog[iso]) daylog[iso] = { weekday: label, exercises: [], dayCheckedIn: false, extraActivity: false };
  daylog[iso].extraActivity = !daylog[iso].extraActivity;
  saveJSON(SK.daylog, daylog);
  renderApp();
}

/* ===== Backup / Restauração ===== */
function getBackupObject() {
  return {
    app: 'rotina-treino-v4',
    exportedAt: new Date().toISOString(),
    altura: loadJSON(SK.altura, null),
    pesos: loadJSON(SK.pesos, []),
    medidas: loadJSON(SK.medidas, []),
    daylog: loadJSON(SK.daylog, {})
  };
}
function setBackupStatus(msg) {
  const el = document.getElementById('backupStatus');
  if (el) el.textContent = msg;
}
function copyBackup() {
  const data = JSON.stringify(getBackupObject(), null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(data).then(() => {
      setBackupStatus('✅ Copiado! Cole em Notas, e-mail pra si mesmo, ou onde preferir guardar.');
    }).catch(() => {
      setBackupStatus('⚠️ Não consegui copiar automático — usa o botão "Baixar arquivo" abaixo.');
    });
  } else {
    setBackupStatus('⚠️ Seu navegador não permite copiar direto — usa o botão "Baixar arquivo" abaixo.');
  }
}
function downloadBackup() {
  const data = JSON.stringify(getBackupObject(), null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'backup-treino-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  setBackupStatus('✅ Arquivo baixado — salva ele nos Arquivos do seu celular ou num drive.');
}
function restoreBackup() {
  const el = document.getElementById('restoreInput');
  const txt = el ? el.value.trim() : '';
  if (!txt) { setBackupStatus('⚠️ Cole o texto do backup antes de restaurar.'); return; }
  try {
    const obj = JSON.parse(txt);
    if (obj.altura !== undefined && obj.altura !== null) saveJSON(SK.altura, obj.altura);
    if (obj.pesos) saveJSON(SK.pesos, obj.pesos);
    if (obj.medidas) saveJSON(SK.medidas, obj.medidas);
    if (obj.daylog) saveJSON(SK.daylog, obj.daylog);
    setBackupStatus('✅ Restaurado com sucesso! Atualizando a tela...');
    setTimeout(() => renderApp(), 700);
  } catch (e) {
    setBackupStatus('❌ Não consegui ler esse texto — confirma que colou o backup completo, sem cortar nada.');
  }
}
function renderBackupBox() {
  return `<div class="card">
    <div class="card-title">💾 Backup e Restauração</div>
    <p class="card-sub">Guarda seus dados fora do navegador — protege contra troca de aparelho, limpeza de cache ou qualquer imprevisto.</p>
    <div class="backup-btn-row">
      <button class="btn-save" onclick="copyBackup()">📋 Copiar backup</button>
      <button class="btn-save btn-save-green" onclick="downloadBackup()">⬇️ Baixar arquivo</button>
    </div>
    <p id="backupStatus" class="hint"></p>
    <div class="sub-box" style="margin-top:12px">
      <div class="sub-box-title">📥 Restaurar backup</div>
      <textarea id="restoreInput" class="backup-textarea" placeholder="Cole aqui o conteúdo do backup (JSON)"></textarea>
      <button class="btn-save btn-save-red" onclick="restoreBackup()">⚠️ Restaurar (substitui os dados atuais)</button>
    </div>
  </div>`;
}

function bucketOfDay(dayOfMonth) { return Math.min(Math.ceil(dayOfMonth/7), 5); }
function renderDesafiosBox(daylog) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const monthLabel = capitalize(now.toLocaleDateString('pt-BR', {month:'long', year:'numeric'}));
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const numBuckets = Math.ceil(daysInMonth/7);
  let weekly = Array(numBuckets).fill(0);
  let monthTotal = 0;
  Object.keys(daylog).forEach(iso => {
    const [yy, mm, dd] = iso.split('-').map(Number);
    if (yy === y && (mm-1) === m) {
      const pts = pointsOf(daylog[iso]);
      monthTotal += pts;
      weekly[bucketOfDay(dd)-1] += pts;
    }
  });
  const weeklyGoal = 50000, monthGoal = 150000;
  const monthPct = Math.round(monthTotal/monthGoal*100);
  return `<div class="card">
    <div class="card-title">🎯 Desafios do Mês</div>
    <p class="card-sub">${monthLabel}</p>
    ${weekly.map((v,i) => {
      const pct = Math.round(v/weeklyGoal*100);
      const hit = v >= weeklyGoal;
      return `<div class="week-challenge-row">
        <span class="week-label">Sem ${i+1}</span>
        <div class="week-bar-bg"><div class="week-bar-fill${hit?' hit':''}" style="width:${Math.min(pct,100)}%"></div></div>
        <span class="week-vals">${hit?'✓ ':''}${Math.round(v/1000)}k/50k · ${pct}%</span>
      </div>`;
    }).join('')}
    <div class="month-goal-box">
      <div class="month-goal-title">Meta do mês: ${Math.round(monthTotal/1000)}k / 150k pts</div>
      <div class="month-goal-pct">${monthPct}%</div>
      <div class="month-goal-sub">${monthTotal>=monthGoal ? 'Meta batida! 🎉' : `faltam ${Math.round((monthGoal-monthTotal)/1000)}k pra bater ${monthLabel}`}</div>
    </div>
  </div>`;
}

function renderHistoricoBox(daylog) {
  const now = new Date();
  const curKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  let byMonth = {};
  Object.keys(daylog).forEach(iso => {
    const key = iso.slice(0,7);
    if (key === curKey) return;
    if (!byMonth[key]) byMonth[key] = {checkins:0, points:0};
    const rec = daylog[iso];
    byMonth[key].points += pointsOf(rec);
    if (rec.dayCheckedIn) byMonth[key].checkins++;
  });
  const keys = Object.keys(byMonth).sort().reverse();
  if (keys.length === 0) {
    return `<div class="card"><div class="card-title">🗓 Histórico Mensal</div><p class="card-sub">Ainda não há meses fechados. Assim que virar o mês, seu resultado aparece aqui.</p></div>`;
  }
  return `<div class="card">
    <div class="card-title">🗓 Histórico Mensal</div>
    ${keys.map(k => {
      const d = byMonth[k];
      const pct = Math.round(d.points/150000*100);
      const pass = d.points >= 150000;
      const [yy, mm] = k.split('-');
      const label = capitalize(new Date(yy, mm-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'}));
      return `<div class="history-row">
        <div class="history-main">${label} — ${d.checkins} check-ins · ${Math.round(d.points/1000)}k pts</div>
        <div class="history-pct ${pass?'pass':'fail'}">${pass?'✅':'❌'} ${pct}% da meta${pass?' batida':''}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function svgLineChart(points, color) {
  if (points.length < 2) return `<p class="hint">Dados insuficientes pra gráfico (precisa de pelo menos 2 registros)</p>`;
  const w = 320, h = 130, pad = 26;
  const vals = points.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const stepX = (w - pad*2) / (points.length - 1);
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = pad + (h - pad*2) * (1 - (p.value - min) / range);
    return {x, y, label: p.label};
  });
  const pathD = coords.map((c,i) => (i===0?'M':'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="${color}"/>`).join('');
  const labels = coords.map(c => `<text x="${c.x.toFixed(1)}" y="${h-6}" font-size="8" fill="#8B978F" text-anchor="middle">${c.label}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${dots}
    ${labels}
    <text x="${pad}" y="14" font-size="9" fill="#8B978F">${max.toFixed(1)}</text>
    <text x="${pad}" y="${h-pad+4}" font-size="9" fill="#8B978F">${min.toFixed(1)}</text>
  </svg>`;
}

function avgCargaGeral(daylog) {
  let vals = [];
  Object.values(daylog).forEach(rec => { if (rec.weights) vals.push(...Object.values(rec.weights)); });
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0) / vals.length;

function hasAnyPRBeatenBesidesFirst(daylog) {
  let names = new Set();
  Object.values(daylog).forEach(rec => { if (rec.weights) Object.keys(rec.weights).forEach(n=>names.add(n)); });
  for (const n of names) {
    const hist = weightHistoryFor(n, daylog);
    if (hist.length >= 2) return true;
  }
  return false;
}

  if (view === 'home') { app.innerHTML = homeHTML(); return; }
  if (view === 'treino') { app.innerHTML = treinoShellHTML(); renderTreinoContent(); return; }
  if (view === 'historico') { app.innerHTML = historicoShellHTML(); renderHistorico(); return; }
  if (view === 'evolucao') { app.innerHTML = evolucaoShellHTML(); renderEvolucao(); return; }
}

renderApp();
</script>
</body>
